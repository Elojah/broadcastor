<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240" role="img" aria-label="A gopher with a megaphone broadcasting messages to subscribers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1a2e"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <g id="envelope">
      <rect x="-9" y="-6" width="18" height="12" rx="2" fill="#e0f2fe"/>
      <path d="M-8 -5 L0 1 L8 -5" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g id="subscriber">
      <rect x="-16" y="-16" width="32" height="32" rx="9" fill="#0f2a40" stroke="#6ad7e5" stroke-width="2"/>
      <circle cx="-5" cy="-1" r="4.5" fill="#fff"/>
      <circle cx="6" cy="-1" r="4.5" fill="#fff"/>
      <circle cx="-7" cy="-1" r="2" fill="#0b1220"/>
      <circle cx="4" cy="-1" r="2" fill="#0b1220"/>
    </g>
  </defs>

  <rect width="480" height="240" rx="24" fill="url(#bg)"/>
  <rect width="480" height="240" rx="24" fill="url(#glow)"/>

  <!-- fan-out: one path per subscriber -->
  <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.7">
    <path d="M248 124 C300 124 330 48 396 48"/>
    <path d="M248 124 C300 124 330 92 396 92"/>
    <path d="M248 124 C300 124 330 136 396 136"/>
    <path d="M248 124 C300 124 330 180 396 180"/>
  </g>
  <use href="#envelope" transform="translate(345 64) rotate(-28)"/>
  <use href="#envelope" transform="translate(317 108) rotate(-12)"/>
  <use href="#envelope" transform="translate(330 132) rotate(6)"/>
  <use href="#envelope" transform="translate(345 168) rotate(28)"/>

  <use href="#subscriber" transform="translate(412 48)"/>
  <use href="#subscriber" transform="translate(412 92)"/>
  <use href="#subscriber" transform="translate(412 136)"/>
  <use href="#subscriber" transform="translate(412 180)"/>

  <!-- gopher -->
  <g stroke="#0a1a2a" stroke-width="2.5" stroke-linejoin="round">
    <circle cx="76" cy="52" r="9" fill="#6ad7e5"/>
    <circle cx="140" cy="52" r="9" fill="#6ad7e5"/>
    <path d="M66 188 C60 144 58 96 70 70 C80 48 96 38 108 38 C122 38 138 48 147 70 C158 96 156 144 152 188 C140 196 78 196 66 188 Z" fill="#6ad7e5"/>
    <ellipse cx="84" cy="194" rx="13" ry="6" fill="#f6d2a2"/>
    <ellipse cx="132" cy="194" rx="13" ry="6" fill="#f6d2a2"/>
    <ellipse cx="62" cy="136" rx="7" ry="5" fill="#f6d2a2"/>
    <circle cx="90" cy="76" r="16" fill="#fff"/>
    <circle cx="127" cy="76" r="16" fill="#fff"/>
    <ellipse cx="110" cy="106" rx="16" ry="11" fill="#f6d2a2"/>
    <rect x="104" y="113" width="12" height="10" rx="1.5" fill="#fff" stroke-width="2"/>
    <path d="M110 113 V123" stroke-width="1.5"/>
    <ellipse cx="110" cy="99" rx="7" ry="4.5" fill="#3a2a20" stroke="none"/>
  </g>
  <circle cx="95" cy="78" r="6" fill="#0b1220"/>
  <circle cx="132" cy="78" r="6" fill="#0b1220"/>
  <circle cx="97" cy="76" r="2" fill="#fff"/>
  <circle cx="134" cy="76" r="2" fill="#fff"/>

  <!-- megaphone, held in the right paw -->
  <g stroke="#0a1a2a" stroke-width="2.5" stroke-linejoin="round">
    <rect x="166" y="130" width="8" height="16" rx="2" fill="#a16207"/>
    <path d="M158 116 L204 100 Q213 123 204 146 L158 130 Z" fill="#fcd34d"/>
    <ellipse cx="205" cy="123" rx="5" ry="23" fill="#f59e0b"/>
    <rect x="156" y="114" width="7" height="18" rx="2" fill="#f59e0b"/>
  </g>
  <path d="M148 140 L166 144" stroke="#0a1a2a" stroke-width="11" stroke-linecap="round"/>
  <path d="M148 140 L166 144" stroke="#6ad7e5" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="170" cy="144" rx="7" ry="5" fill="#f6d2a2" stroke="#0a1a2a" stroke-width="2.5"/>

  <!-- sound -->
  <g fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round">
    <path d="M220 110 Q228 123 220 136"/>
    <path d="M230 100 Q243 123 230 146" opacity="0.6"/>
  </g>

  <text x="240" y="226" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1" fill="#94a3b8">broadcastor</text>
</svg>
