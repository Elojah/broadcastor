version: "2"

linters:
  # Default set of linters.
  # The value can be:
  # - `standard`: https://golangci-lint.run/docs/linters/#enabled-by-default
  # - `all`: enables all linters by default.
  # - `none`: disables all linters by default.
  # - `fast`: enables only linters considered as "fast" (`golangci-lint help linters --json | jq '[ .[] | select(.fast==true) ] | map(.name)'`).
  # Default: standard
  default: all
  # Enable specific linter.
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    # - depguard
    - dogsled
    # - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    # - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    # - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    # - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    # - goconst
    # - gocritic
    - gocyclo
    - godot
    # - godox
    - goheader
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    # - inamedparam
    - ineffassign
    # - interfacebloat
    - intrange
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    # - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    # - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    # - recvcheck
    # - revive
    # - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    # - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    # - unparam
    - unused
    - usestdlibvars
    - usetesting
    # - varnamelen
    - wastedassign
    - whitespace
    # - wrapcheck
    # - wsl
    # - wsl_v5
    - zerologlint
  # Disable specific linters.
  disable:
    - depguard # Hard to maintain for no plus value
    - dupl # In a template world why not but in Go...
    - exhaustruct # Default ommited values are ok
    - funlen # Makes no sense in an actual project
    - gochecknoglobals # May be ok to have const
    - goconst # For "classic" strings like POST, prefer to keep them hardcode
    - gocritic # Raise switch type but there is no way to change it in if clause
    - godox # Very convenient but enable/disable manually
    - inamedparam # Named parameters are not idiomatic in Go
    - interfacebloat # Hard to maintain for DDD layers
    - mnd # Not realistic for a medium size project
    - noinlineerr # why though ?
    - recvcheck # Why forbid this ?
    - revive # wants to merge error checking and return
    - rowserrcheck # Would be great to enable it but too many false positives, needs fixing
    - tagliatelle # No ? mix snake and camel case is ok for env/json vars
    - unparam # Error return should be automatic, even in nil case
    - varnamelen # Personal opinion, but I think it's better to keep variable names short
    - wrapcheck # Errors only defined in own package don't feel right
    - wsl # deprecated
    - wsl_v5 # False positive ? not sure how to use

  # All available settings of specific linters.
  settings:
    # See the dedicated "linters.settings" documentation section.
    gocognit:
      # minimal code complexity to report, 30 by default (but we recommend 10-20)
      min-complexity: 100
    nestif:
      # minimal complexity of if statements to report, 5 by default
      min-complexity: 10
    lll:
      line-length: 180
    misspell:
      # The MQTT broker examples/24-mqtt names.
      ignore-rules:
        - mosquitto
    cyclop:
      max-complexity: 30
    gomoddirectives:
      # Modules nested in this one, such as examples/19-redis, build against the working tree.
      replace-local: true
  # Defines a set of rules to ignore issues.
  # It does not skip the analysis, and so does not ignore "typecheck" errors.
  exclusions:
    # Mode of the generated files analysis.
    #
    # - `strict`: sources are excluded by strictly following the Go generated file convention.
    #    Source files that have lines matching only the following regular expression will be excluded: `^// Code generated .* DO NOT EDIT\.$`
    #    This line must appear before the first non-comment, non-blank text in the file.
    #    https://go.dev/s/generatedcode
    # - `lax`: sources are excluded if they contain lines like `autogenerated file`, `code generated`, `do not edit`, etc.
    # - `disable`: disable the generated files exclusion.
    #
    # Default: strict
    generated: lax
    # Log a warning if an exclusion rule is unused.
    # Default: false
    warn-unused: true
    rules:
      # The examples are programs whose job is to print what happens.
      - path: ^examples/
        linters:
          - forbidigo
