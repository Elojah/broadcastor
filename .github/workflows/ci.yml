name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      # Pinned, so that lint results are the same locally and in CI. The Makefile uses ./bin/golangci-lint when present.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b ./bin v2.11.3

      - name: Lint and test
        run: make check

  tinygo:
    runs-on: ubuntu-latest
    # Pinned, like golangci-lint. A dev build, since TinyGo 0.42.0's sync.RWMutex never wakes a writer once a reader
    # queues behind it (tinygo-org/tinygo#5692), which deadlocks pkg/gate: use the 0.43.0 release once it is out.
    container: tinygo/tinygo-dev:sha-f6d269f74ab45bfa53a37c5708c6661ec33531ae
    # The checkout belongs to another user than the container's, so git refuses it and Go fails to stamp the VCS.
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run pkg/gate's tests with TinyGo
        run: make tinygo-test

      - name: Run each example with TinyGo and check its output
        run: make tinygo-run

      - name: Build each example for pico with TinyGo
        run: make tinygo-build
