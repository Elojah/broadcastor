name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      # Pinned, so that lint results are the same locally and in CI. The Makefile uses ./bin/golangci-lint when present.
      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b ./bin v2.11.3

      - name: Lint and test
        run: make check

  tinygo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      # Pinned, like golangci-lint.
      - name: Install TinyGo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/tinygo.deb" https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo_0.43.0_amd64.deb
          sudo dpkg -i "$RUNNER_TEMP/tinygo.deb"

      - name: Run pkg/gate's tests with TinyGo
        run: make tinygo-test

      - name: Run each example with TinyGo and check its output
        run: make tinygo-run

      - name: Build each example for pico with TinyGo
        run: make tinygo-build
